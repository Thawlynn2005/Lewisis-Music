# Builds the Lewisis' Music desktop app on each operating system's own runner:
#   Linux   → .deb and .AppImage   (ubuntu-22.04, so it runs on older distributions too)
#   Windows → .msi and setup .exe  (windows-latest, x64)
#   macOS   → .dmg and .app        (macos-latest, Apple Silicon)
# The installers are attached to each run as downloadable artifacts. Pushing a
# tag like v3.0.0 also creates a draft GitHub release with them attached.
#
# The AI separation model (htdemucs.onnx) is not kept in git: the first job
# makes it from the public Demucs weights with desktop/tools/export_demucs_onnx.py,
# and every build bundles it, so Separate Audio works out of the box.

name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - "static/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "static/**"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  model:
    name: Separation model
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the model if the export script hasn't changed
        id: cache
        uses: actions/cache@v4
        with:
          path: model/htdemucs.onnx
          key: htdemucs-onnx-fp16-${{ hashFiles('desktop/tools/export_demucs_onnx.py') }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Export htdemucs to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.15.*" "torchaudio==2.15.*" "demucs==4.0.1" "onnx==1.23.*" "onnxruntime==1.32.*" numpy
          mkdir -p model
          python desktop/tools/export_demucs_onnx.py model/htdemucs.onnx --fp16

      - uses: actions/upload-artifact@v4
        with:
          name: separation-model
          path: model/htdemucs.onnx
          retention-days: 7

  test:
    name: Tests (Rust and web)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Rust tests
        working-directory: desktop
        run: cargo test --workspace --locked
      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/desktop.js

  build:
    name: Build (${{ matrix.name }})
    needs: model
    permissions:
      contents: write # only used to attach installers to a draft release on tag pushes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: macOS
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the separation model
        uses: actions/download-artifact@v4
        with:
          name: separation-model
          path: desktop/app/resources

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy's strip can't handle newer ELF sections; Rust already strips the binary.
          NO_STRIP: "true"
        with:
          projectPath: desktop/app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles ${{ matrix.bundles }}
          # Only on tag pushes: a draft release with the installers attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Lewisis'' Music {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lewisis-music-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/macos/*.app

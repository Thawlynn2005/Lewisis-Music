[package]
name = "lewisis-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fft-convolver = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "aac", "isomp4", "ogg", "vorbis"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

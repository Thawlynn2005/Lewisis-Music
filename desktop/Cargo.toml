[workspace]
resolver = "3"
members = ["core", "engine", "app", "wasm"]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "MIT"

# Smaller, faster release builds (the installers).
[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# The web version's WebAssembly: small, and with its feature section kept
# (wasm-bindgen reads it).
[profile.release.package.lewisis-wasm]
opt-level = "s"
strip = false

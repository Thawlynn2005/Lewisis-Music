[package]
name = "lewisis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Thaw Zin Lynn"]
description = "Library, playlists, song info and lyrics for Lewisis' Music"

[features]
# Everything the desktop app needs on top of the parts the web version also
# uses (song info, covers, genres, lyrics parsing, FLAC): the library on disk,
# AI separation with ONNX Runtime, the online lyrics lookup, Migrate.
default = ["native"]
native = ["flacenc/par", "dep:ort", "dep:rubato", "dep:sha2", "dep:symphonia", "dep:ureq", "dep:uuid", "dep:libc", "dep:windows-sys"]

[dependencies]
flacenc = { version = "0.5.1", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
lofty = "0.25.5"
# ONNX Runtime is loaded at run time from a library shipped with the app
# (Microsoft's own build, see tools/fetch_onnxruntime.py) instead of being
# linked in: the statically linked build needs glibc 2.38 / GCC 13, which
# older Linux systems (and the Ubuntu 22.04 build machine) don't have.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"], optional = true }
regex = "1.13.2"
rubato = { version = "5.1.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "aac", "isomp4", "ogg", "vorbis"], optional = true }
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"], optional = true }
uuid = { version = "1.29.3", features = ["v4"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "lewisis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Thaw Zin Lynn"]
description = "Library, playlists, song info and lyrics for Lewisis' Music"

[dependencies]
flacenc = "0.5.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
lofty = "0.25.5"
# ONNX Runtime is loaded at run time from a library shipped with the app
# (Microsoft's own build, see tools/fetch_onnxruntime.py) instead of being
# linked in: the statically linked build needs glibc 2.38 / GCC 13, which
# older Linux systems (and the Ubuntu 22.04 build machine) don't have.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
regex = "1.13.2"
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "aac", "isomp4", "ogg", "vorbis"] }
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

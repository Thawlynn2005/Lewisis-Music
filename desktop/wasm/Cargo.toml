[package]
name = "lewisis-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Thaw Zin Lynn"]
description = "The parts of Lewisis' Music that the web version runs in the browser (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lewisis-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.130"
serde_json = "1"

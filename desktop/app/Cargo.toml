[package]
name = "lewisis-music"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Thaw Zin Lynn"]
description = "Lewisis' Music: a local music player"
default-run = "lewisis-music"

[lib]
name = "lewisis_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lewisis-core = { path = "../core" }
lewisis-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"

# The Linux web view (WebKitGTK), to set how it renders; same version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[dev-dependencies]
tempfile = "3.27.0"
